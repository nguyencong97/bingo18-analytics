name: 24/7 Cloud Crawler & Data Sync

on:
  schedule:
    # Chạy mỗi 10 phút từ 23:00 UTC đến 15:00 UTC (tương đương 06:00 đến 22:00 giờ Việt Nam UTC+7)
    - cron: '*/10 23,0-15 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên web GitHub bất kỳ lúc nào

concurrency:
  group: bingo18-crawler
  cancel-in-progress: false

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Crawler & Integrity Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: |
          python -m crawler.run
          python -m stats.integrity
          python -m stats.compute_phase6_results
          python -m stats.compute_phase8_results

      - name: Commit and Push new data to GitHub
        run: |
          git config --local user.email "bot@bingo18analytics.local"
          git config --local user.name "Bingo18 Cloud Bot"
          if git status --porcelain | grep -qE "data/|results/|web/public/results/"; then
            git add data/ results/ web/public/results/
            git commit -m "data(auto): live update draws $(date +'%Y-%m-%d %H:%M')"
            git push origin master
          else
            echo "Không có dữ liệu mới cần commit."
          fi
